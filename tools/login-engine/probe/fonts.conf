<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig for XPS5's login window (the engine's FONTCONFIG_FILE): the
  fonts the console itself has, read in place, so XPS5 carries no fonts.
  The cache goes to the engine's own folder.
-->
<fontconfig>
  <dir>/preinst/common/font</dir>
  <cachedir>/data/TwitterPS5/engine/fontcache</cachedir>
</fontconfig>
